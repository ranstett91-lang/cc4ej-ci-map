name: Refresh EJScreen Data

# Runs automatically on June 1 each year (EJScreen typically releases May–June).
# Can also be triggered manually from the Actions tab with optional overrides.

on:
  schedule:
    - cron: '0 12 1 6 *'   # 12:00 UTC on June 1

  workflow_dispatch:
    inputs:
      fields:
        description: 'Field group to refresh'
        required: false
        default: 'all'
        type: choice
        options: [all, eb, sv, edu]
      dry_run:
        description: 'Dry run — preview changes without committing'
        required: false
        default: false
        type: boolean

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated GeoJSON back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh EJScreen data
        run: |
          ARGS="--fields ${{ inputs.fields || 'all' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python3 scripts/update_ejscreen.py "$ARGS"

      - name: Commit and push if data changed
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add de_blockgroups.geojson
          if git diff --staged --quiet; then
            echo "No changes — EJScreen data is already up to date."
          else
            VINTAGE=$(date -u +%Y-%m-%d)
            git commit -m "Auto-refresh EJScreen data ($VINTAGE) [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "Pushed updated de_blockgroups.geojson"
          fi
