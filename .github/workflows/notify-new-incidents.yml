name: Notify subscribers of new incidents

# Weekly diff of chemical_disasters.json against notification_state.json.
# Sends email via Resend when new entries appear in DE/PA/NJ/MD.

on:
  schedule:
    - cron: '0 13 * * 1'   # 13:00 UTC every Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — log diffs but skip email and state commit'
        required: false
        default: false
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit notification_state.json back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run incident-diff notifier
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          NOTIFY_RECIPIENTS: ${{ vars.NOTIFY_RECIPIENTS }}
          NOTIFY_STATES: ${{ vars.NOTIFY_STATES }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            unset RESEND_API_KEY
          fi
          python3 scripts/check_new_incidents.py

      - name: Commit updated notification_state.json
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notification_state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update notification_state.json [skip ci]"
            git push origin ${{ github.ref_name }}
          fi
